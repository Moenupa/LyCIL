[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[project]
name = "LyCIL"
version = "0.1.2"
description = "A clean, PyTorch Lightning (2.x) continual/incremental learning (CIL) library inspired by PyCIL, with up-to-date methods, NPU support, modern interface, and ready-to-run CLI examples."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "datasets[vision]>=4.0",
    "scikit-learn>=1.3.2,<1.9.0",
    "tqdm",
    "jsonargparse[signatures,jsonschema,jsonnet]",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-xdist",
    "ruff",
]

# conflict lightning and lightning-npu
[project.optional-dependencies]
cuda = [
    "lycil[torch-cuda,lightning,wandb]"
]
npu = [
    "torch-npu>=2.1.0",
    "decorator",
    "psutil",
    "importlib_metadata",
    "lightning @ git+https://github.com/SmallPigPeppa/pytorch-lightning.git@npu_support_fp16_mixed",
    "lycil[wandb]"
]
ghactions = [
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.7.1%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and python_version == '3.11' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.7.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and python_version == '3.12' and platform_machine == 'x86_64'",
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.7.1%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and python_version == '3.13' and platform_machine == 'x86_64'",
    "torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.22.1%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and python_version == '3.11' and platform_machine == 'x86_64'",
    "torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.22.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and python_version == '3.12' and platform_machine == 'x86_64'",
    "torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.22.1%2Bcpu-cp313-cp313-manylinux_2_28_x86_64.whl ; platform_system == 'Linux' and python_version == '3.13' and platform_machine == 'x86_64'",
    "lycil[lightning,wandb]",
]
torch-cuda = [
    "torch>=2.7.1,<2.10.0",
    "torchvision",
]
lightning = [
    "lightning>=2.2.0,<2.6.0",
]
wandb = [
    "wandb>=0.20.0,<0.25.0,!=0.24.0"
]

[project.urls]
homepage = "http://moenupa.github.io/LyCIL"
documentation = "https://github.com/Moenupa/LyCIL"
repository = "https://github.com/Moenupa/LyCIL"

[tool.uv]
conflicts = [
    [
        { extra = "ghactions" },
        { extra = "cuda" },
        { extra = "npu" },
        { extra = "torch-cuda" },
    ],
    [
        { extra = "npu" },
        { extra = "lightning" },
    ],
]

# if you are using CUDA and wants to specify cuda version
# [tool.uv.sources]
# torch = [
# 	{ index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
# ]
# torchvision = [
# 	{ index = "pytorch-cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
# ]
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
